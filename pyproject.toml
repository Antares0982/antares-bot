[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "antares_bot"
version = "22.8"
license-files = ["LICENSE"]
description = "A Telegram bot framework wrapping many things."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "antares-ptb[job-queue]==22.8",
    "aiosqlite",
    "apscheduler",
    "httpx",
    "objgraph",
    "pytz",
]
authors = [
    { name = "Antares", email = "antares@alyr.dev" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Communications :: Chat",
    "Topic :: Internet",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = [
    "python",
    "telegram",
    "bot",
    "api",
    "wrapper",
]

[tool.uv.build-backend]
module-root = ""

[project.urls]
"Bug Tracker" = "https://github.com/Antares0982/antares-bot/issues"
"Source Code" = "https://github.com/Antares0982/antares-bot"

[project.scripts]
antares_bot = "antares_bot.__main__:main"

[project.optional-dependencies]
webhooks = [
    "antares-ptb[webhooks]",
]
pika = [
    "aio-pika"
]
test = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.pyright]
include = ["antares_bot", "modules", "tests"]
venvPath = "."
venv = ".nix-pyenv"

[tool.autopep8]
max-line-length = 160

[tool.pylint]
disable = ["C", "R", "W0401", "W0603", "W0613", "W0718"]
